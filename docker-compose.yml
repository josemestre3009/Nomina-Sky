services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nomina_sky}
      POSTGRES_USER: ${POSTGRES_USER:-nomina_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nomina_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nomina_user} -d ${POSTGRES_DB:-nomina_sky}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:8000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-clave-secreta-docker-super-segura}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nomina_user}:${POSTGRES_PASSWORD:-nomina_pass}@db:5432/${POSTGRES_DB:-nomina_sky}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "flask db upgrade &&
             flask seed &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 2 run:app"

volumes:
  postgres_data:
